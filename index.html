<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Ujian Sekolah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-6 text-white text-center">
            <h1 class="text-xl font-bold tracking-wide">PANEL KONTROL GURU</h1>
            <p class="text-xs text-emerald-100 mt-1">Sistem Pembuat & Pengirim Link Ujian Siswa</p>
        </div>

        <!-- Form Konten -->
        <form id="form-ujian" class="p-6 space-y-5">
            
            <!-- Input 1: Mata Pelajaran -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Mata Pelajaran</label>
                <div class="relative">
                    <select id="mapel" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2.5 px-3.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all appearance-none cursor-pointer">
                        <option value="" disabled selected>-- Pilih Mata Pelajaran --</option>
                        <option value="Ilmu Pengetahuan Sosial (IPS)">Ilmu Pengetahuan Sosial (IPS)</option>
                        <option value="Ilmu Pengetahuan Alam (IPA)">Ilmu Pengetahuan Alam (IPA)</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Input 2: Link Google Form -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Link Google Form</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-brands fa-google-drive text-sm"></i>
                    </div>
                    <input type="url" id="form-url" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2.5 pl-9 pr-3 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all" placeholder="https://docs.google.com/forms/d/...">
                </div>
            </div>

            <!-- Input 3: Pilihan Kelas Tujuan -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Kelas Tujuan</label>
                <div class="grid grid-cols-3 gap-2">
                    <!-- Kelas VII.A -->
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="VII.A" class="sr-only peer">
                        <div class="p-2 text-center text-xs font-medium border border-slate-200 rounded-lg text-slate-600 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all">VII.A</div>
                    </label>
                    <!-- Kelas VII.B -->
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="VII.B" class="sr-only peer">
                        <div class="p-2 text-center text-xs font-medium border border-slate-200 rounded-lg text-slate-600 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all">VII.B</div>
                    </label>
                    <!-- Kelas VIII.A -->
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="VIII.A" class="sr-only peer">
                        <div class="p-2 text-center text-xs font-medium border border-slate-200 rounded-lg text-slate-600 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all">VIII.A</div>
                    </label>
                    <!-- Kelas VIII.B -->
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="VIII.B" class="sr-only peer">
                        <div class="p-2 text-center text-xs font-medium border border-slate-200 rounded-lg text-slate-600 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all">VIII.B</div>
                    </label>
                    <!-- Kelas IX.A -->
                    <label class="cursor-pointer select-none">
                        <input type="checkbox" value="IX.A" class="sr-only peer">
                        <div class="p-2 text-center text-xs font-medium border border-slate-200 rounded-lg text-slate-600 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all">IX.A</div>
                    </label>
                </div>
            </div>

            <!-- Anti-Nyontek Toggle -->
            <div class="bg-amber-50 border border-amber-100 rounded-xl p-3.5 flex items-start gap-3">
                <div class="text-amber-600 mt-0.5">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-xs font-bold text-amber-800">Proteksi Keamanan Aktif</h4>
                    <p class="text-[11px] text-amber-700/90 mt-0.5 leading-relaxed">Sistem Anti-Nyontek akan mendeteksi kecurangan siswa saat berpindah tab.</p>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100">
                <!-- KOTAK UNTUK MENAMPILKAN LINK YANG AKAN DI-COPY KE WA -->
                <div id="hasil-link" class="mb-4 p-4 bg-white border border-slate-200 rounded-lg shadow-sm" style="display: none;">
                    <p class="text-sm font-medium text-slate-700 mb-2">👉 Salin link ujian ini dan kirim ke WhatsApp Siswa:</p>
                    <div class="flex gap-2">
                        <input type="text" id="link-siswa" readonly class="w-full p-2 text-xs border border-slate-300 rounded bg-slate-50 text-slate-600" onclick="this.select()">
                        <button type="button" onclick="salinTeksLink()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded font-medium">Salin</button>
                    </div>
                </div>

                <!-- TOMBOL HIJAU UTAMA KIRIM UJIAN -->
                <button type="button" onclick="buatLinkUjian()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-sm text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    Mulai & Kirim Ujian
                </button>
            </div>

        </form>
    </div>

    <script>
        // --- KODE LOGIKA PARAMETER URL UNTUK SISWA & GURU ---
        
        function buatLinkUjian() {
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'siswa.html';
            const formUrl = document.getElementById('form-url').value.trim();
            const mapel = document.getElementById('mapel').value;
            
            const kelasCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const kelasList = Array.from(kelasCheckboxes).map(cb => cb.value);

            if (!mapel) {
                alert('Silakan pilih Mata Pelajaran terlebih dahulu!');
                return;
            }
            if (!formUrl) {
                alert('Silakan masukkan Link Google Form terlebih dahulu!');
                return;
            }
            if (kelasList.length === 0) {
                alert('Silakan pilih minimal satu Kelas Tujuan!');
                return;
            }

            // Generate Link enkripsi sederhana untuk siswa
            const encryptedParam = btoa(encodeURIComponent(JSON.stringify({
                f: formUrl,
                m: mapel,
                k: kelasList.join(',')
            })));

            const linkFinal = ${baseUrl}?v=${encryptedParam};
            
            // Tampilkan kotak hasil link
            document.getElementById('link-siswa').value = linkFinal;
            document.getElementById('hasil-link').style.display = 'block';
            
            alert('Ujian Berhasil Dikirim!');
        }

        function salinTeksLink() {
            const linkInput = document.getElementById('link-siswa');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);

            try {
                navigator.clipboard.writeText(linkInput.value);
                alert('Link berhasil disalin! Silakan paste (Ctrl+V) ke WhatsApp Siswa.');
            } catch (err) {
                document.execCommand('copy');
                alert('Link berhasil disalin!');
            }
        }
    </script>
</body>
</html>
