<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - Sistem Ujian Terpadu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="p-8">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400">Pusat Ujian Online</h1>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-6">
            <h3 class="text-xl font-bold mb-4 text-indigo-400 border-b border-slate-700 pb-2">Input Link Google Form</h3>
            
            <form action="" method="POST" onsubmit="alert('Konfigurasi berhasil disimpan!'); return false;">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Nama Mata Pelajaran</label>
                    <select name="mapel" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">-- Pilih Mata Pelajaran --</option>
                        
                        <optgroup label="Mata Pelajaran Umum">
                            <option value="Pendidikan Agama dan Budi Pekerti">Pendidikan Agama dan Budi Pekerti</option>
                            <option value="Pendidikan Pancasila dan Kewarganegaraan (PPKn)">Pendidikan Pancasila dan Kewarganegaraan (PPKn)</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                            <option value="Matematika">Matematika</option>
                            <option value="Ilmu Pengetahuan Alam (IPA)">Ilmu Pengetahuan Alam (IPA)</option>
                            <option value="Ilmu Pengetahuan Sosial (IPS)">Ilmu Pengetahuan Sosial (IPS)</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                        </optgroup>

                        <optgroup label="Seni & Keterampilan">
                            <option value="Seni Budaya (Rupa/Musik/Tari/Teater)">Seni Budaya (Rupa/Musik/Tari/Teater)</option>
                            <option value="Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK)">Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK)</option>
                            <option value="Prakarya dan Kewirausahaan">Prakarya dan Kewirausahaan</option>
                            <option value="Informatika / TIK">Informatika / TIK</option>
                        </optgroup>

                        <optgroup label="Muatan Lokal">
                            <option value="Bahasa Daerah">Bahasa Daerah</option>
                            <option value="Bimbingan Konseling (BK)">Bimbingan Konseling (BK)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Alokasi Waktu Mengerjakan (Menit)</label>
                    <input type="number" name="durasi_menit" placeholder="Contoh: 90" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Target Kelas Ujian</label>
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-3">
                        
                        <div class="flex flex-wrap gap-4 items-center border-b border-slate-800 pb-2">
                            <span class="text-xs font-bold text-indigo-400 w-16">Kelas VII:</span>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="VII-A" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-indigo-500" onchange="renderLinkDinamis()"> VII-A
                            </label>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="VII-B" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-indigo-500" onchange="renderLinkDinamis()"> VII-B
                            </label>
                        </div>

                        <div class="flex flex-wrap gap-4 items-center border-b border-slate-800 pb-2">
                            <span class="text-xs font-bold text-emerald-400 w-16">Kelas VIII:</span>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="VIII-A" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500" onchange="renderLinkDinamis()"> VIII-A
                            </label>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="VIII-B" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500" onchange="renderLinkDinamis()"> VIII-B
                            </label>
                        </div>

                        <div class="flex flex-wrap gap-4 items-center">
                            <span class="text-xs font-bold text-amber-400 w-16">Kelas IX:</span>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="IX-A" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-amber-600 focus:ring-amber-500" onchange="renderLinkDinamis()"> IX-A
                            </label>
                            <label class="inline-flex items-center text-sm text-slate-300 cursor-pointer">
                                <input type="checkbox" value="IX-B" class="kelas-checkbox mr-1.5 rounded bg-slate-800 border-slate-700 text-amber-600 focus:ring-amber-500" onchange="renderLinkDinamis()"> IX-B
                            </label>
                        </div>

                    </div>
                </div>

                <div id="wadah-link-google-form"></div>

                <button type="submit" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg">
                    Simpan Jadwal Ujian
                </button>
            </form>
        </div>

        <div class="mt-10 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-indigo-400">Simulator Monitor</h2>
            <div id="monitor-screen" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-400 text-sm">Belum ada aktivitas ujian yang dipantau.</p>
            </div>
        </div>

    </div>

    <script>
    function renderLinkDinamis() {
        const wadah = document.getElementById('wadah-link-google-form');
        wadah.innerHTML = ''; 
        
        const kelasTerpilih = document.querySelectorAll('.kelas-checkbox:checked');
        
        if (kelasTerpilih.length > 0) {
            const boxWrapper = document.createElement('div');
            boxWrapper.className = "bg-slate-950 p-4 rounded-lg mt-4 border border-slate-700 border-l-4 border-l-teal-500";
            boxWrapper.innerHTML = '<p class="text-xs font-bold text-teal-400 mb-2">Masukkan Link Google Form untuk Tiap Kelas:</p>';
            
            kelasTerpilih.forEach(checkbox => {
                const grupInput = document.createElement('div');
                grupInput.className = "mb-3";
                grupInput.innerHTML = `
                    <label class="block text-xs text-slate-400 mb-1">Link Form <strong>Kelas ${checkbox.value}</strong>:</label>
                    <input type="url" name="link_google_form[${checkbox.value}]" placeholder="Paste link Google Form kelas ${checkbox.value}..." required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-100 focus:ring-1 focus:ring-teal-500 focus:border-teal-500">
                `;
                boxWrapper.appendChild(grupInput);
            });
            
            wadah.appendChild(boxWrapper);
        }
    }
    </script>
</body>
</html>
